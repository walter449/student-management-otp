<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — UniGestión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #181c27;
            --surface2: #1e2333;
            --border: #2a2f42;
            --accent: #6c8fff;
            --accent-glow: rgba(108, 143, 255, 0.15);
            --text: #e8eaf0;
            --muted: #7a80a0;
            --radius: 14px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* glow de fondo decorativo */
        body::before {
            content: '';
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(108,143,255,0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        /* franja de color arriba */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(90deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 28px;
        }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-sub {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 32px;
        }

        /* separador de pasos */
        .steps {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
        }

        .step {
            flex: 1;
            height: 3px;
            border-radius: 99px;
            background: var(--border);
            transition: background 0.3s;
        }

        .step.active { background: var(--accent); }

        /* fields */
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .field label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .field input {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            padding: 11px 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .field input::placeholder { color: #3a3f55; }

        /* OTP input especial */
        #otp {
            letter-spacing: 0.3em;
            font-size: 1.2rem;
            text-align: center;
            font-family: 'Syne', sans-serif;
        }

        button {
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            transition: all 0.2s;
            width: 100%;
            padding: 12px;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            margin-top: 8px;
        }

        .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .link-row {
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .link-row a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .link-row a:hover { text-decoration: underline; }

        /* sección OTP oculta por defecto */
        #otp-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        #otp-section.visible { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hint {
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
            margin-top: 12px;
        }

        .hint span {
            color: var(--accent);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">🎓 UniGestión</div>

        <h2 class="card-title">Iniciar sesión</h2>
        <p class="card-sub">Ingresa tu correo para recibir el código OTP</p>

        <!-- barra de pasos -->
        <div class="steps">
            <div class="step active" id="step-1"></div>
            <div class="step" id="step-2"></div>
        </div>

        <!-- paso 1: email -->
        <div id="email-section">
            <div class="field">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@correo.com">
            </div>
            <button id="send-btn" class="btn-primary">Enviar código OTP</button>
        </div>

        <!-- paso 2: OTP -->
        <div id="otp-section">
            <div class="field">
                <label for="otp">Código de verificación</label>
                <input type="text" id="otp" placeholder="000000" maxlength="6">
            </div>
            <p class="hint">Código enviado a <span id="email-display"></span></p>
            <button id="verify-btn" class="btn-primary">Verificar y entrar</button>
        </div>

        <div class="link-row">
            ¿No tienes cuenta? <a href="/frontend/register.html">Regístrate</a>
        </div>
    </div>

    <script>
        // Mostrar sección OTP al hacer clic en "Enviar"
        document.getElementById('send-btn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            if (!email) return;
            document.getElementById('email-display').textContent = email;
            document.getElementById('email-section').style.display = 'none';
            document.getElementById('otp-section').classList.add('visible');
            document.getElementById('step-2').classList.add('active');
        });
    </script>

  <script src="/frontend/app.js?v=2"></script>
</body>
</html>
